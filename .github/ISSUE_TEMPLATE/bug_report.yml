name: Hata bildirimi
description: Beklendiği gibi çalışmayan bir şeyi bildirin
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Loglar, hata mesajları, stack trace'ler ve ekran görüntüleri tam olarak ihtiyacımız olan şeylerdir.**

        İstediğiniz kadarını yapıştırın. Aklınızda zaten bir düzeltme varsa söyleyin: hata burada
        doğrulandıktan sonra bir pull request memnuniyetle karşılanır ve yanlış olduğunu
        düşündüğünüz dosyayı ve satırı göstermek tek başına da işe yarar. Kurul issue-first
        çalışır, dolayısıyla bildirim PR'dan önce gelir.

        Bkz. [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md).

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Bunun için mevcut bir issue var mı?
      description: Yeni bir issue açmadan önce açık ve kapalı issue'larda arama yapın.
      options:
        - label: Arama yaptım ve bu hata için mevcut bir issue bulamadım
          required: true

  - type: textarea
    id: description
    attributes:
      label: Ne oldu?
      description: Hatanın açık bir tanımı.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Yeniden üretme adımları
      description: Hatayı tetikleyen kesin adımlar.
      placeholder: |
        1. '...' sayfasına gidin
        2. '...' öğesine tıklayın
        3. Hatayı görün
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Beklenen davranış
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Gerçekleşen davranış
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ortam
      description: Bu nerede oldu?
      options:
        - Yerel geliştirme (docker compose)
        - Self-host edilmiş deployment
        - Diğer
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Ek bağlam
      description: Loglar, ekran görüntüleri ya da ilgili başka her şey.
