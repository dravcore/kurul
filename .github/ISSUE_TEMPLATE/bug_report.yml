name: Bug report
description: Report something that isn't working as expected
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Please describe the problem rather than pasting a fix.**

        Logs, error messages, stack traces and screenshots are exactly what we need — paste
        as many as you like. But please keep **your own patches and code snippets out of the
        thread**: a diff is your copyrighted work, and while the Contributor License Agreement
        is still in draft the maintainer cannot safely read one and then write the fix.
        Pointing at a file and line and explaining what you think is wrong is better than a
        diff, and it is not a smaller contribution.

        See [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md#code-contributions-are-paused).

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Is there an existing issue for this?
      description: Search open and closed issues before filing a new one.
      options:
        - label: I searched and found no existing issue for this bug
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where did this happen?
      options:
        - Local development (docker compose)
        - Self-hosted deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Logs, screenshots, or anything else relevant.
