name: Özellik isteği
description: Yeni bir özellik ya da iyileştirme önerin
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **Sorunu, kimi etkilediğini ve nasıl davranmasını beklediğinizi anlatın.**

        Yol haritasını şekillendiren şey budur ve üzerinde oy (upvote) bulunan bir fikir, bu projenin
        aldığı en güçlü sinyaldir. Uygulamalar da hoş karşılanır: Kurul issue-first çalışır, bu
        yüzden önce burada önerin, maintainer geri bildirimini bekleyin, sonra pull request'i açın.

        Bkz. [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md).

  - type: checkboxes
    id: existing-issue
    attributes:
      label: Bunun için mevcut bir issue var mı?
      description: Yeni bir issue açmadan önce açık ve kapalı issue'larda arama yapın.
      options:
        - label: Arama yaptım ve bu özellik için mevcut bir issue bulamadım
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem tanımı
      description: Bu hangi sorunu çözüyor? Kimler etkileniyor?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Önerilen çözüm
      description: Ne olmasını istersiniz?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Değerlendirilen alternatifler
      description: Düşündüğünüz diğer yaklaşımlar ve neden onları seçmediğiniz.

  - type: textarea
    id: context
    attributes:
      label: Ek bağlam
      description: Mockup'lar, bağlantılar ya da ilgili başka her şey.

  - type: markdown
    attributes:
      value: |
        Not: bu bir issue-first süreçtir — lütfen uygulamaya başlamadan önce maintainer geri
        bildirimini bekleyin. Bkz. [CONTRIBUTING.md](https://github.com/dravcore/kurul/blob/develop/CONTRIBUTING.md).
