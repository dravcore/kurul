name: CLA (disabled)

# ============================================================================
#  DISABLED ON PURPOSE — DO NOT RE-ENABLE WITHOUT A LAWYER'S REVIEW.
# ============================================================================
#
# WHY THIS IS OFF
#   Kurultay does not accept external code, documentation, or translation pull requests
#   (ADR 0015 — docs/decisions/0015-no-external-contributions.md). With no outside patch
#   ever being merged, there is nobody to ask for a signature.
#
#   Worse, docs/cla.md is still a DRAFT pending legal review, so a live check would ask a
#   contributor to sign an unreviewed agreement in order to unblock a pull request that
#   would not be merged either way. That is confusing at best and disrespectful of the
#   contributor's effort at worst. And a signature collected against a draft may not be
#   valid — collecting no signatures is better than collecting invalid ones, because an
#   invalid one only surfaces at the most expensive moment (the first commercial sale).
#
# WHAT WOULD TURN IT BACK ON
#   All three, together — no partial re-enable:
#     1. A lawyer has reviewed docs/cla.md and every `[FILL: …]` / `[ASK A LAWYER: …]`
#        marker is resolved, and the not-in-force banner has been removed.
#     2. ADR 0015 has been superseded (or amended) by a decision to reopen the project to
#        external contributions.
#     3. The one-time setup below has actually been done.
#
# HOW IT IS DISABLED (two independent guards — restore both to re-enable)
#     a. The `on:` triggers are reduced to `workflow_dispatch`; the real triggers are kept
#        below as comments so restoring them is mechanical rather than a rewrite.
#     b. The `cla` job carries `if: ${{ false }}`, so even a deliberate manual dispatch is
#        a no-op until that guard is removed.
#   Nothing else was deleted: the action pin, the signing sentence, the allowlist, and the
#   comment bodies are all intact and ready.
#
# ONE-TIME SETUP — DO NOT DO THIS NOW. It only applies when the workflow is re-enabled;
# doing it while the workflow is dormant would block every pull request on a check that
# can never report.
#   1. Create the orphan branch that holds the signature ledger:
#        git switch --orphan cla-signatures && git commit --allow-empty -m "chore: cla ledger"
#        git push -u origin cla-signatures
#      Signatures live on their own branch so the bot never pushes to `develop` or `main`,
#      which Git Flow forbids and branch protection would reject anyway.
#   2. Add "CLA" to the required status checks in branch protection for `develop`.
#
# Rationale for the CLA itself and for this tooling choice:
# docs/decisions/0014-dual-licensing-cla.md (target model, suspended by 0015).

on:
  # Manual only, and even then the job below refuses to run. This is the disabled state.
  workflow_dispatch:
  #
  # ---- RESTORE THE BLOCK BELOW TO RE-ENABLE (see "WHAT WOULD TURN IT BACK ON") ----
  #
  # `pull_request_target`, not `pull_request`: the job needs a write-scoped token to commit the
  # signature file and comment on the PR, which `pull_request` does not get from a fork. This is
  # safe here only because nothing from the PR head is checked out or executed — the action reads
  # PR metadata through the API and writes the ledger. Never add a checkout of the PR head here.
  #
  # Every PR, not just those targeting develop/main. A stacked PR (one wave based on the previous
  # one) has a feature branch as its base, so a `[develop, main]` filter skipped it entirely — and
  # GitHub still reported the PR as mergeable, which reads as "CLA passed". Same reasoning as ci.yml.
  #
  #   pull_request_target:
  #     branches: ['**']
  #     types: [opened, synchronize, closed]
  #   # How a contributor signs: by posting the signing sentence as a PR comment.
  #   issue_comment:
  #     types: [created]

permissions:
  actions: write # re-runs the blocked CLA check once a signature arrives
  contents: write # commits the signature ledger to the cla-signatures branch
  pull-requests: write # posts the "please sign" / "all signed" comments
  statuses: write # sets the CLA commit status that blocks merge

concurrency:
  # Keyed per pull request. Never cancel in progress: a cancelled run can drop a signature that
  # was already acknowledged in a comment.
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # SECOND GUARD — the workflow is disabled (see the header). This constant short-circuits
    # the job even if the triggers above are restored by accident. Removing it is a deliberate,
    # reviewable one-line change; restore the original condition below when re-enabling:
    #   # Ignore comments on plain issues; only PR comments can carry a signature.
    #   if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    if: ${{ false }}
    steps:
      - name: Check CLA signatures
        # `contains` rather than an exact `==` on the comment body: GitHub expression string
        # comparison is case-insensitive but whitespace-sensitive, and a contributor who adds a
        # trailing word would otherwise get a silently skipped run instead of a signature. The
        # action itself still requires the exact sentence before it records anything.
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          contains(github.event.comment.body, 'I have read the Kurultay CLA')
        # contributor-assistant/github-action, pinned to the v2.6.1 commit. The upstream repo was
        # archived in March 2026 and is no longer maintained; released versions still work, and
        # pinning to a SHA means an abandoned repo cannot change under us. Revisit if the node20
        # runtime is retired or a maintained fork gains traction.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/dravcore/kurultay/blob/develop/docs/cla.md'
          # Version is part of the path AND of the signing sentence below, so a signature can
          # never be silently carried over to an amended CLA text.
          path-to-signatures: 'signatures/v0.1/cla.json'
          branch: 'cla-signatures'
          # Maintainers already hold the rights this CLA grants, and bots cannot sign.
          allowlist: dogancanyildiz,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: 'I have read the Kurultay CLA v0.1 and I hereby sign it'
          custom-notsigned-prcomment: |
            Thanks for the pull request! Before it can be merged, every commit author on it
            needs to sign the [Kurultay Contributor License Agreement](https://github.com/dravcore/kurultay/blob/develop/docs/cla.md).

            Kurultay is AGPL-3.0 and intends to stay that way. The CLA exists because the
            project is funded by **dual licensing** — the maintainer also sells a commercial
            license to the same code — and that requires permission from every contributor to
            distribute their work under a license other than AGPL-3.0. You keep the copyright
            in your code and every right to reuse it, and the CLA guarantees your contribution
            stays published under AGPL-3.0 as well. The reasoning, including the downsides, is
            in [ADR 0014](https://github.com/dravcore/kurultay/blob/develop/docs/decisions/0014-dual-licensing-cla.md).

            If you agree, post a new comment on this pull request containing exactly:
          custom-allsigned-prcomment: |
            All contributors have signed the Kurultay CLA. Thank you.
          # Signature comments must not be editable after the PR is merged.
          lock-pullrequest-aftermerge: true
