services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: kurultay
      POSTGRES_PASSWORD: kurultay
      POSTGRES_DB: kurultay
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kurultay -d kurultay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://kurultay:kurultay@postgres:5432/kurultay
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_URL: http://localhost:3000
      BETTER_AUTH_SECRET: change-me-in-production
      BETTER_AUTH_URL: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
