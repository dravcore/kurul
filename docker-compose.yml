services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kurultay
      POSTGRES_PASSWORD: kurultay
      POSTGRES_DB: kurultay
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kurultay -d kurultay']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Scheduled logical backups. Every BACKUP_INTERVAL seconds `scripts/backup.sh` writes one
  # `pg_dump -Fc` archive into the backup_data volume and prunes it to BACKUP_KEEP archives,
  # so a self-hosted instance has a recovery point without anyone remembering to take one.
  # The image is the same postgres:18-alpine as the server, so pg_dump/pg_restore always
  # match the server major. Restore procedure: docs/development.md#upgrading-and-backups.
  #
  # backup_data lives on the same host as postgres_data — that covers "I dropped the wrong
  # table", not "the disk died". Copy the volume off-host as well; see the same section.
  backup:
    image: postgres:18-alpine
    environment:
      # postgres:5432 is the in-network address, same as the api/migrate services above —
      # unrelated to the host .env DATABASE_URL used by the dev loop.
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: kurultay
      PGPASSWORD: kurultay
      PGDATABASE: kurultay
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    # The one service that must come back by itself: a backup sidecar that stays down after
    # a reboot silently stops producing recovery points.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: applies pending Prisma migrations, then exits. `api` waits for it to finish
  # successfully before starting, so the schema is never missing on first boot.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    environment:
      # postgres:5432 (not localhost) — this is the in-network address, unrelated to
      # whatever DATABASE_URL a developer has in their host .env for the dev loop.
      DATABASE_URL: postgresql://kurultay:kurultay@postgres:5432/kurultay
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # `unless-stopped` (not `on-failure`) so the whole stack comes back after a host
    # reboot or daemon restart, not only after an in-container crash. `migrate` is the
    # deliberate exception: it is a one-shot job that must stay exited.
    restart: unless-stopped
    environment:
      # postgres:5432 / redis:6379 are the in-network addresses; they're intentionally not
      # sourced from the host .env, whose DATABASE_URL/REDIS_URL point at localhost for the
      # dev-loop run mode (docs/development.md#run-modes) and would not resolve in-container.
      DATABASE_URL: postgresql://kurultay:kurultay@postgres:5432/kurultay
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      # No baked-in default: compose fails loudly instead of booting with a known secret.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env — see docs/development.md#environment-variables}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      # SMTP is optional — unlike BETTER_AUTH_SECRET above, compose does not fail loudly when
      # it's unset. The mail module falls back to logging instead of sending, so the API still
      # boots, but no invitation can be accepted until these are set in .env (see
      # docs/decisions/0013-invitation-email-verification.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - '4000:4000'
    # /health/ready probes DB + Redis (200 only when both respond within 2s), so "healthy"
    # means "actually able to serve requests", not just "process is up". busybox wget ships
    # in node:24-alpine — no curl needed. 127.0.0.1, not localhost: busybox wget resolves
    # localhost to ::1 first, which a v4-only listener refuses.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/health/ready >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so it must be a build arg, not just a
        # runtime environment variable — see apps/web/Dockerfile.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - '3000:3000'
    # busybox wget follows 3xx redirects, so a redirecting root page still counts as healthy;
    # only a non-2xx final response (or no response) fails the probe. 127.0.0.1, not
    # localhost: Next.js standalone listens IPv4-only on 0.0.0.0, and busybox wget resolves
    # localhost to ::1 first — connection refused despite a healthy server.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backup_data:
